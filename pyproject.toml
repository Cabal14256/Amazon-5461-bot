[project]
name = "amazon-5461-bot"
version = "0.1.0"
description = "Amazon Seller Central 5461/GTIN workflow automation helper for Codex local project usage."
requires-python = ">=3.11"
dependencies = [
  "playwright==1.54.0",
  "requests==2.32.3",
  "PyYAML==6.0.2",
  "python-dotenv==1.0.1",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
